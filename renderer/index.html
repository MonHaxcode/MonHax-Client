<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>MonHax Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="tb">
    <span class="tbi"></span><span class="tbt">MonHax Launcher</span>
    <div class="tbc">
      <button data-win="min" aria-label="Minimieren"><svg width="12" height="12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button data-win="max" aria-label="Maximieren"><svg width="12" height="12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button data-win="close" class="x" aria-label="Schließen"><svg width="12" height="12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
  </header>
  <div class="shell">
    <aside>
      <button id="acc" class="accb"><i class="av" id="accAv">M</i><div><b id="accName">Nicht angemeldet</b><small id="accState"><u></u>Nicht angemeldet</small></div></button>
      <nav>
        <button data-page="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Startseite</button>
        <button data-page="library"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7zM12 12l9-5M12 12v10M12 12L3 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Installationen</button>
        <button data-page="discover"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8"/></svg>Entdecken</button>
        <button data-page="news"><svg viewBox="0 0 24 24"><path d="M4 4h13v16H5a1 1 0 0 1-1-1zM17 8h3v11a1 1 0 0 1-1 1h-2M7 8h7M7 12h7M7 16h4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Neuigkeiten</button>
        <button data-page="cosmetics" class="cos"><svg viewBox="0 0 24 24"><path d="M3 8l4 3 5-7 5 7 4-3-2 11H5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Cosmetics</button>
        <hr>
        <button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" stroke="currentColor" stroke-width="1.7"/></svg>Einstellungen</button>
      </nav>
      <div class="wm">MonHax</div>
    </aside>
    <main>
      <section id="p-home">
        <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07040f"/><stop offset=".55" stop-color="#1a0b3d"/><stop offset="1" stop-color="#4a17a8"/></linearGradient>
            <radialGradient id="glow" cx=".5" cy=".95" r=".6"><stop offset="0" stop-color="#8b3dff" stop-opacity=".55"/><stop offset="1" stop-color="#8b3dff" stop-opacity="0"/></radialGradient>
          </defs>
          <rect width="1600" height="900" fill="url(#sky)"/><rect width="1600" height="900" fill="url(#glow)"/>
          <g transform="translate(220 110) rotate(12)"><rect width="130" height="130" fill="#6a35c9"/><g fill="#a572ff"><rect x="0" y="0" width="43" height="43"/><rect x="87" y="0" width="43" height="43"/><rect x="43" y="43" width="44" height="44"/><rect x="0" y="87" width="43" height="43"/><rect x="87" y="87" width="43" height="43"/></g></g>
          <g fill="#0a0613"><path d="M0 900V690l90-20v-120h40v120l70 30V560h50v140l80-60 60 50v170z"/><path d="M520 900V700h40V560l30-70 30 70v140h70V620h40v-90l30-80 30 80v90h40v80h70V560l40-100 40 100v220h50V680h120v220z"/><path d="M1180 900V740h50V610h40v130h60V500h60v400z"/><path d="M1420 900V560h70V450h50v110h60v340z"/></g>
          <g fill="#b27bff" opacity=".85"><rect x="95" y="535" width="24" height="24"/><rect x="560" y="545" width="18" height="18"/><rect x="1255" y="595" width="20" height="20"/><rect x="1505" y="435" width="24" height="24"/></g>
          <g fill="#c9a6ff" opacity=".5"><rect x="640" y="180" width="6" height="6"/><rect x="980" y="120" width="6" height="6"/><rect x="1200" y="260" width="8" height="8"/><rect x="420" y="330" width="6" height="6"/><rect x="820" y="300" width="6" height="6"/></g>
        </svg>
        <h1 class="logo">MINECRAFT</h1>
        <button class="play-btn big" id="homePlay"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M6 3l15 9-15 9z" fill="currentColor"/></svg><span>Spielen</span></button>
        <div class="vbar">
          <i class="cube"></i>
          <div class="vsel"><select id="hSel" aria-label="Modpack"></select><small id="hVer"></small></div>
          <button class="sq" id="hFolder" aria-label="Ordner öffnen"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
          <button class="sq" id="hMore" aria-label="Installationen"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg></button>
        </div>
        <div class="tag">MonHax<small>Play, Build, Survive</small></div>
      </section>
      <section id="p-library" class="pg" hidden></section>
      <section id="p-discover" class="pg" hidden></section>
      <section id="p-news" class="pg" hidden></section>
      <section id="p-cosmetics" class="pg" hidden></section>
      <section id="p-settings" class="pg" hidden></section>
    </main>
  </div>
  <dialog id="dlg">
    <h3>Neue Installation</h3>
    <label>Name<input id="nName" placeholder="Mein Survival-Pack"></label>
    <label>Minecraft-Version<select id="nVer"></select></label>
    <label>Loader<select id="nLoader"><option value="fabric">Fabric</option><option value="vanilla">Vanilla</option></select></label>
    <label>Arbeitsspeicher: <b id="nRamV">4096</b> MB<input id="nRam" type="range" min="2048" max="16384" step="512" value="4096"></label>
    <div class="acts end"><button class="ghost" id="nCancel">Abbrechen</button><button class="btn" id="nOk">Anlegen</button></div>
  </dialog>
  <dialog id="dlg2">
    <h3>Cosmetic per Link laden</h3>
    <label>PNG-Link (https)<input id="uUrl" placeholder="https://…/cape.png"></label>
    <label class="chk" id="uSlimW"><input type="checkbox" id="uSlim"> Slim-Modell (nur Skins)</label>
    <div class="acts end"><button class="ghost" id="uCancel">Abbrechen</button><button class="btn" id="uOk">Laden</button></div>
  </dialog>
  <div id="login" hidden>
    <div class="lbox"><div class="lm">MonHax</div><h2>Willkommen</h2>
      <p>Melde dich mit deinem Microsoft-Konto an, auf dem Minecraft Java Edition liegt.</p>
      <button class="btn lbtn" id="loginBtn">Mit Microsoft anmelden</button></div>
  </div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
